name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      # actions/checkout v5 (tag v5 / v5.1.0), pinned to the commit SHA resolved on 2026-08-25
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # actions/setup-python v7 (tag v7), pinned to the commit SHA resolved on 2026-08-25
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile scripts
        run: python -m py_compile skills/super-eli5/scripts/validate_spec.py skills/super-eli5/scripts/render_html.py skills/super-eli5/scripts/verify_artifact.py skills/super-eli5/scripts/self_check.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Self check bundled examples
        run: python skills/super-eli5/scripts/self_check.py --json
